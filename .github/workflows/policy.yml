name: OpenShell policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

# Tracks openshell-annotate main: the actions come from @main and `version: source`
# builds the CLI from those same sources, so this playground catches upstream breakage early.

jobs:
  check:
    name: drift + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Fails when openshell/policy.yaml no longer matches the @openshell directives.
      # The playground's DENY cards are unannotated on purpose, so lint warns but only errors fail the job.
      - uses: ilanh/openshell-annotate/actions/check@main
        with:
          version: source
          policy: openshell/policy.yaml
          failure-threshold: error

  image:
    name: build sandbox image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ilanh/openshell-annotate/actions/setup@main
        with:
          version: source
      # Regenerate the policy the image ships with and keep it as a build artifact.
      - uses: ilanh/openshell-annotate/actions/generate@main
        with:
          policy-out: openshell/policy.yaml
          upload-artifact: "true"
          artifact-name: playground-policy
      - name: Build image (not pushed)
        run: docker build -t policy-playground:ci .
